info:
  name: Get GitHub Profile (Sahil Kanojiya)
  type: http
  seq: 1
  tags:
    - github

http:
  method: GET
  url: "https://api.github.com/users/sahil-kanojiya"
  headers:
    - name: User-Agent
      value: Bruno-OpenCollection
    - name: Accept
      value: application/vnd.github.v3+json
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.login
      operator: eq
      value: sahil-kanojiya

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
