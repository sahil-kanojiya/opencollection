info:
  name: Health Check
  type: http
  seq: 1
  tags:
    - health

http:
  method: GET
  url: "{{baseUrl}}:8081/actuator/health"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
